<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Calorie Mate</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-fire text-orange-500 text-2xl"></i>
                <span class="font-bold text-xl text-gray-800">Calorie Mate</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="profile.html" class="text-gray-600 hover:text-orange-500 font-medium">
                    <i class="fa-solid fa-user-gear mr-1"></i> Profile
                </a>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Welcome & Date Selector -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 id="welcomeText" class="text-2xl font-bold text-gray-800">Welcome back!</h1>
                <p class="text-gray-500 text-sm">Track your daily nutrition and hit your goals.</p>
            </div>
            <div>
                <input type="date" id="selectedDate" class="border border-gray-300 rounded-lg px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
        </div>

        <!-- Calorie Summary Card -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 flex flex-col sm:flex-row justify-around items-center text-center gap-6">
            <div>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-wider">Calorie Goal</p>
                <p id="goalDisplay" class="text-3xl font-extrabold text-gray-800">2500</p>
            </div>
            <div class="hidden sm:block h-12 w-px bg-gray-200"></div>
            <div>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-wider">Food Eaten</p>
                <p id="consumedDisplay" class="text-3xl font-extrabold text-orange-500">0</p>
            </div>
            <div class="hidden sm:block h-12 w-px bg-gray-200"></div>
            <div>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-wider">Remaining</p>
                <p id="remainingDisplay" class="text-3xl font-extrabold text-blue-600">2500</p>
            </div>
        </div>

        <!-- Add Meal Form -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8">
            <h2 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-plus-circle text-orange-500 mr-2"></i>Log a Meal</h2>
            <form id="mealForm" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <input type="text" id="mealName" placeholder="Meal name (e.g. Chicken Rice)" required class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 sm:col-span-2">
                <input type="number" id="mealCalories" placeholder="Calories (kcal)" required class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg px-4 py-2 transition duration-200">Add Meal</button>
            </form>
        </div>

        <!-- Meal List -->
        <div class="bg-white rounded-2xl shadow-sm p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-list-ul text-orange-500 mr-2"></i>Today's Meals</h2>
            <div id="mealList" class="divide-y divide-gray-100">
                <!-- Meals injected dynamically via JavaScript -->
                <p id="noMealsText" class="text-gray-400 text-center py-4">No meals logged for this date yet.</p>
            </div>
        </div>

    </main>

    <!-- Script Logic -->
    <script>
        const token = localStorage.getItem('token');
        const email = localStorage.getItem('email');

        if (!token || !email) {
            window.location.href = 'index.html';
        }

        const dateInput = document.getElementById('selectedDate');
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = todayStr;

        async function fetchMeals() {
            const selectedDate = dateInput.value;
            try {
                const res = await fetch(`/api/meals?email=${encodeURIComponent(email)}&date=${selectedDate}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    renderDashboard(data.meals, data.calorieGoal);
                }
            } catch (err) {
                console.error('Failed to fetch meals', err);
            }
        }

        function renderDashboard(meals, calorieGoal) {
            const goalDisplay = document.getElementById('goalDisplay');
            const consumedDisplay = document.getElementById('consumedDisplay');
            const remainingDisplay = document.getElementById('remainingDisplay');
            const mealList = document.getElementById('mealList');

            goalDisplay.textContent = calorieGoal;

            let totalConsumed = 0;
            mealList.innerHTML = '';

            if (meals.length === 0) {
                mealList.innerHTML = `<p class="text-gray-400 text-center py-4">No meals logged for this date yet.</p>`;
            } else {
                meals.forEach(meal => {
                    totalConsumed += meal.mealCalories || meal.calories || 0;
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center py-3';
                    item.innerHTML = `
                        <div>
                            <p class="font-semibold text-gray-800">${meal.mealName || meal.name}</p>
                            <p class="text-xs text-gray-400">${meal.mealCalories || meal.calories} kcal</p>
                        </div>
                        <button onclick="deleteMeal('${meal._id}')" class="text-red-400 hover:text-red-600 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    mealList.appendChild(item);
                });
            }

            consumedDisplay.textContent = totalConsumed;
            remainingDisplay.textContent = calorieGoal - totalConsumed;
        }

        document.getElementById('mealForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mealName = document.getElementById('mealName').value;
            const mealCalories = Number(document.getElementById('mealCalories').value);
            const date = dateInput.value;

            try {
                const res = await fetch('/api/meals', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email, mealData: { mealName, mealCalories, date } })
                });

                if (res.ok) {
                    document.getElementById('mealName').value = '';
                    document.getElementById('mealCalories').value = '';
                    fetchMeals();
                }
            } catch (err) {
                console.error('Failed to save meal', err);
            }
        });

        async function deleteMeal(mealId) {
            try {
                const res = await fetch(`/api/meals/${mealId}`, {
                    method: 'DELETE',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email })
                });
                if (res.ok) {
                    fetchMeals();
                }
            } catch (err) {
                console.error('Failed to delete meal', err);
            }
        }

        dateInput.addEventListener('change', fetchMeals);

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        fetchMeals();
    </script>
</body>
</html>
