<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Mate - Profile Settings</title>
    
    <script>
        const token = localStorage.getItem('calorie_mate_token');
        if (!token) window.location.replace("index.html"); 
        
        let userEmail = "User";
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            userEmail = payload.email;
        } catch (e) { console.error("Could not decode token"); }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0B1120] text-slate-200 min-h-screen pb-20">

    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-leaf text-emerald-400"></i>
                    <span class="font-bold text-lg text-white tracking-wide">CALORIE MATE</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-400" id="user-display"></span>
                    <a href="dashboard.html" class="text-sm text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-chart-pie mr-1"></i> Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Profile Settings</h1>
            <p class="text-slate-400 mt-2">Manage your personal details to keep your calorie goals accurate.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div id="success-message" class="hidden mb-6 p-4 bg-emerald-500/10 border border-emerald-500/50 rounded-xl text-emerald-400 text-sm text-center font-bold"></div>
            <div id="error-message" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/50 rounded-xl text-red-400 text-sm text-center font-bold"></div>

            <form id="profile-form" onsubmit="handleUpdateProfile(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Email Address (Cannot be changed)</label>
                    <input type="email" id="profile-email" class="w-full px-4 py-3 bg-slate-800/50 text-slate-500 rounded-xl border border-slate-700 outline-none cursor-not-allowed" disabled>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Full Name</label>
                    <input type="text" id="profile-name" class="w-full px-4 py-3 bg-slate-800 text-white rounded-xl border border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" required>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Age</label>
                        <input type="number" id="profile-age" class="w-full px-4 py-3 bg-slate-800 text-white rounded-xl border border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" required min="10" max="120">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Sex</label>
                        <select id="profile-sex" class="w-full px-4 py-3 bg-slate-800 text-white rounded-xl border border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="save-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-[0_0_15px_rgba(5,150,105,0.2)]">Save Changes</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-display').innerHTML = `<i class="fa-regular fa-circle-user mr-1"></i> ${userEmail}`;
            document.getElementById('profile-email').value = userEmail;
            loadProfileData();
        });

        async function loadProfileData() {
            try {
                const response = await fetch(`/api/profile?email=${encodeURIComponent(userEmail)}`);
                const data = await response.json();
                
                if (response.ok) {
                    if (data.name) document.getElementById('profile-name').value = data.name;
                    if (data.age) document.getElementById('profile-age').value = data.age;
                    if (data.sex) document.getElementById('profile-sex').value = data.sex;
                }
            } catch (err) {
                console.error("Failed to fetch profile details", err);
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const successBox = document.getElementById('success-message');
            const errorBox = document.getElementById('error-message');
            
            btn.disabled = true; 
            btn.innerText = "Saving...";
            successBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            const updatedData = {
                email: userEmail,
                name: document.getElementById('profile-name').value,
                age: document.getElementById('profile-age').value,
                sex: document.getElementById('profile-sex').value
            };

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || "Failed to update profile.");
                
                successBox.innerText = "Profile successfully updated!";
                successBox.classList.remove('hidden');
                setTimeout(() => successBox.classList.add('hidden'), 4000);
                
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Changes";
            }
        }
    </script>
</body>
</html>
